<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Project development posts for the Volk Security Systems website.">
  <title>Volk Security Systems | News</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>
    document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "light");
  </script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .news-intro {
      max-width: 760px;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <main>
    <section class="page-banner">
      <div class="container">
        <h1>Project News and Development Blog</h1>
        <p>The posts below are loaded from a JSON file with JavaScript.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="news-intro">
          <h2>How the website was built</h2>
          <p class="muted">These posts explain the JavaScript features used in the project.</p>
        </div>

        <div class="filter-box">
          <label for="blog-filter">Search posts</label>
          <input id="blog-filter" type="search" placeholder="Try theme, JSON, form or filter">
        </div>

        <p id="blog-loading">Loading posts...</p>
        <p id="blog-no-results" class="no-results">No matching posts were found.</p>
        <div id="blog-list" class="post-list"></div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <script src="js/theme.js"></script>
  <script src="js/components.js"></script>
  <script src="js/filter.js"></script>
  <script src="js/blog.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
